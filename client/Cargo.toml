[package]
name = "uran"
version = "0.1.0"
edition = "2021"

[dependencies]
egui = { version = "0.27", features = ["clipboard"] }
eframe = { version = "0.27", features = ["default", "clipboard"] }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
dirs = "5.0"
urlencoding = "2.1"
chrono = "0.4"
arboard = "3.3"