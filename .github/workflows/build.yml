name: Build Multi-Platform

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux
            arch: x64
            artifact_suffix: linux-x64
          
          # Linux ARM64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            platform: linux
            arch: arm64
            artifact_suffix: linux-arm64
            setup_cross: true
          
          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows
            arch: x64
            artifact_suffix: windows-x64
          
          # Windows ARM64
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            platform: windows
            arch: arm64
            artifact_suffix: windows-arm64
          
          # macOS x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: macos
            arch: x64
            artifact_suffix: macos-x64
          
          # macOS ARM64
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos
            arch: arm64
            artifact_suffix: macos-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup Rust
      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          override: true

      # Install cross-compilation dependencies for Linux ARM64
      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.setup_cross == true
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Install Electron dependencies
      - name: Install Electron dependencies
        working-directory: ./client
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci
          else
            npm install
          fi
        shell: bash

      # Build setup project (Rust)
      - name: Build setup project
        working-directory: ./setup
        run: cargo build --release --target ${{ matrix.target }}
        shell: bash
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ env.CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER }}

      # Debug: Show setup build output
      - name: Debug setup build output
        run: |
          echo "Setup build output:"
          ls -la ./setup/target/${{ matrix.target }}/release/ || echo "Directory not found"
          echo "Finding any executables in setup:"
          find ./setup -name "setup*" -type f 2>/dev/null || echo "No setup files found"
        shell: bash

      # Build launcher project (Rust)
      - name: Build launcher project
        working-directory: ./launcher
        run: cargo build --release --target ${{ matrix.target }}
        shell: bash
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ env.CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER }}

      # Debug: Show launcher build output
      - name: Debug launcher build output
        run: |
          echo "Launcher build output:"
          ls -la ./launcher/target/${{ matrix.target }}/release/ || echo "Directory not found"
          echo "Finding any executables in launcher:"
          find ./launcher -name "launcher*" -type f 2>/dev/null || echo "No launcher files found"
        shell: bash

      # Build Electron app
      - name: Build Electron app
        working-directory: ./client
        shell: bash
        run: |
          # Установка electron-builder
          npm install -g electron-builder
          
          # Сборка приложения
          npm run build
          
          # Поиск и копирование бинарника
          echo "Looking for built executable..."
          
          if [[ "${{ matrix.platform }}" == "windows" ]]; then
            # Windows
            exe_file=$(find ./dist -name "*.exe" -type f 2>/dev/null | head -n 1)
            if [[ -n "$exe_file" ]]; then
              cp "$exe_file" ./uran.exe
              echo "✅ Copied to uran.exe from $exe_file"
            else
              echo "⚠️ No executable found, listing directory structure:"
              ls -la ./dist/ || echo "No dist directory"
            fi
          else
            # Linux/macOS
            binary_file=$(find ./dist -name "uran" -type f 2>/dev/null | head -n 1)
            if [[ -n "$binary_file" ]]; then
              cp "$binary_file" ./uran
              chmod +x ./uran
              echo "✅ Copied to uran from $binary_file"
            else
              echo "⚠️ No binary found, listing directory structure:"
              ls -la ./dist/ || echo "No dist directory"
            fi
          fi
          
          # Для отладки - показать структуру
          echo "Current directory contents:"
          ls -la

      # Prepare artifacts - FIXED VERSION
      - name: Prepare artifacts
        shell: bash
        run: |
          # Создаем директорию для артефактов
          mkdir -p artifacts
          
          # Копируем бинарники Rust проектов с правильными путями
          echo "=== Copying Rust binaries ==="
          
          # Путь до бинарников
          SETUP_PATH="./setup/target/${{ matrix.target }}/release"
          LAUNCHER_PATH="./launcher/target/${{ matrix.target }}/release"
          
          # Проверяем и копируем setup
          if [[ "${{ matrix.platform }}" == "windows" ]]; then
            if [ -f "${SETUP_PATH}/setup.exe" ]; then
              cp "${SETUP_PATH}/setup.exe" "artifacts/setup-${{ matrix.artifact_suffix }}.exe"
              echo "✅ Copied setup.exe"
            else
              echo "❌ setup.exe not found at ${SETUP_PATH}/setup.exe"
              ls -la ${SETUP_PATH} || echo "Directory not found"
            fi
            
            if [ -f "${LAUNCHER_PATH}/launcher.exe" ]; then
              cp "${LAUNCHER_PATH}/launcher.exe" "artifacts/launcher-${{ matrix.artifact_suffix }}.exe"
              echo "✅ Copied launcher.exe"
            else
              echo "❌ launcher.exe not found at ${LAUNCHER_PATH}/launcher.exe"
              ls -la ${LAUNCHER_PATH} || echo "Directory not found"
            fi
          else
            # Linux/macOS
            if [ -f "${SETUP_PATH}/setup" ]; then
              cp "${SETUP_PATH}/setup" "artifacts/setup-${{ matrix.artifact_suffix }}"
              chmod +x "artifacts/setup-${{ matrix.artifact_suffix }}"
              echo "✅ Copied setup binary"
            else
              echo "❌ setup binary not found at ${SETUP_PATH}/setup"
              ls -la ${SETUP_PATH} || echo "Directory not found"
            fi
            
            if [ -f "${LAUNCHER_PATH}/launcher" ]; then
              cp "${LAUNCHER_PATH}/launcher" "artifacts/launcher-${{ matrix.artifact_suffix }}"
              chmod +x "artifacts/launcher-${{ matrix.artifact_suffix }}"
              echo "✅ Copied launcher binary"
            else
              echo "❌ launcher binary not found at ${LAUNCHER_PATH}/launcher"
              ls -la ${LAUNCHER_PATH} || echo "Directory not found"
            fi
          fi
          
          # Копируем Electron бинарник
          echo "=== Copying Electron binary ==="
          if [[ "${{ matrix.platform }}" == "windows" ]]; then
            if [ -f "./client/uran.exe" ]; then
              cp "./client/uran.exe" "artifacts/uran-${{ matrix.artifact_suffix }}.exe"
              echo "✅ Copied uran.exe"
            else
              echo "❌ uran.exe not found"
              find ./client -name "*.exe" -type f || echo "No exe files found"
            fi
          else
            if [ -f "./client/uran" ]; then
              cp "./client/uran" "artifacts/uran-${{ matrix.artifact_suffix }}"
              chmod +x "artifacts/uran-${{ matrix.artifact_suffix }}"
              echo "✅ Copied uran binary"
            else
              echo "❌ uran binary not found"
              find ./client -name "uran" -type f || echo "No uran files found"
            fi
          fi
          
          # Создаем README
          cat > artifacts/README.txt << EOF
          Build Information:
          Platform: ${{ matrix.platform }}
          Architecture: ${{ matrix.arch }}
          Target: ${{ matrix.target }}
          Build Date: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          Runner OS: ${{ runner.os }}
          
          Artifacts included:
          - setup: Rust project from /setup
          - launcher: Rust project from /launcher  
          - uran: Electron application from /client
          EOF
          
          echo ""
          echo "=== Final artifacts directory contents ==="
          ls -la artifacts/
          
          # Проверяем количество файлов
          ARTIFACT_COUNT=$(ls -1 artifacts/ | wc -l)
          echo "Total artifacts: $ARTIFACT_COUNT"

      # Upload artifacts
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.artifact_suffix }}
          path: artifacts/
          retention-days: 30
          if-no-files-found: error  # Теперь будет ошибка если файлов нет

  # Upload all artifacts combined
  upload-all-artifacts:
    needs: build
    runs-on: ubuntu-latest
    if: always() && github.event_name != 'pull_request'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          pattern: build-*
          merge-multiple: true
          
      - name: Create combined archive
        run: |
          if [ -d "all-artifacts" ] && [ "$(ls -A all-artifacts)" ]; then
            cd all-artifacts
            zip -r ../all-builds-$(date +%Y%m%d-%H%M%S).zip .
            cd ..
            echo "Combined archive created with $(ls all-artifacts | wc -l) files"
          else
            echo "No artifacts to combine"
          fi
          
      - name: Upload combined archive
        uses: actions/upload-artifact@v4
        with:
          name: all-builds-combined
          path: all-builds-*.zip
          retention-days: 30
          if-no-files-found: warn
