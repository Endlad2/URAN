name: Build Multi-Platform

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  APP_NAME: uran

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux
            arch: x64
            artifact_suffix: linux-x64
          
          # Linux ARM64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            platform: linux
            arch: arm64
            artifact_suffix: linux-arm64
            setup_cross: true
          
          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows
            arch: x64
            artifact_suffix: windows-x64
          
          # Windows ARM64
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            platform: windows
            arch: arm64
            artifact_suffix: windows-arm64
          
          # macOS x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: macos
            arch: x64
            artifact_suffix: macos-x64
          
          # macOS ARM64
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos
            arch: arm64
            artifact_suffix: macos-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup Rust
      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          override: true

      # Install cross-compilation dependencies for Linux ARM64
      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.setup_cross == true
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Run build.py
      - name: Run build.py
        run: python build.py
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ env.CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER }}

      # Prepare artifacts for release
      - name: Prepare artifacts
        shell: bash
        run: |
          echo "=== Preparing artifacts for ${{ matrix.artifact_suffix }} ==="
          
          # Create archive directory
          mkdir -p archive
          
          # Variables
          ZIP_NAME="${{ env.APP_NAME }}-${{ matrix.artifact_suffix }}.zip"
          SETUP_NAME="setup-${{ matrix.artifact_suffix }}"
          
          if [[ "${{ matrix.platform }}" == "windows" ]]; then
            # For Windows
            SETUP_NAME="${SETUP_NAME}.exe"
            
            # Create zip with uran and launcher
            if [ -d "build/uran-app" ]; then
              mv build/uran-app archive/uran
              zip -r "$ZIP_NAME" archive/uran
              echo "✅ Created $ZIP_NAME with uran folder"
            elif [ -f "build/uran.exe" ]; then
              cp build/uran.exe archive/
              zip -r "$ZIP_NAME" archive/uran.exe
              echo "✅ Created $ZIP_NAME with uran.exe"
            fi
            
            # Rename installer to setup
            if [ -f "build/uran_installer.exe" ]; then
              cp build/uran_installer.exe "$SETUP_NAME"
              echo "✅ Created $SETUP_NAME"
            elif [ -f "build/uran_installer" ]; then
              cp build/uran_installer "$SETUP_NAME"
              echo "✅ Created $SETUP_NAME"
            fi
            
          elif [[ "${{ matrix.platform }}" == "linux" ]]; then
            # For Linux
            # Create zip with uran and launcher
            if [ -d "build/uran-app" ]; then
              mv build/uran-app archive/uran
              zip -r "$ZIP_NAME" archive/uran
              echo "✅ Created $ZIP_NAME"
            elif [ -f "build/uran" ]; then
              cp build/uran archive/
              chmod +x archive/uran
              zip -r "$ZIP_NAME" archive/uran
              echo "✅ Created $ZIP_NAME"
            fi
            
            # Rename installer to setup
            if [ -f "build/uran_installer" ]; then
              cp build/uran_installer "$SETUP_NAME"
              chmod +x "$SETUP_NAME"
              echo "✅ Created $SETUP_NAME"
            fi
            
          else # macOS
            # For macOS
            # Create zip with uran and launcher
            if [ -d "build/uran.app" ]; then
              mv build/uran.app archive/uran.app
              zip -r "$ZIP_NAME" archive/uran.app
              echo "✅ Created $ZIP_NAME"
            elif [ -f "build/uran" ]; then
              cp build/uran archive/
              chmod +x archive/uran
              zip -r "$ZIP_NAME" archive/uran
              echo "✅ Created $ZIP_NAME"
            fi
            
            # Rename installer to setup
            if [ -f "build/uran_installer" ]; then
              cp build/uran_installer "$SETUP_NAME"
              chmod +x "$SETUP_NAME"
              echo "✅ Created $SETUP_NAME"
            fi
          fi
          
          # Copy launcher if exists separately
          if [ -f "build/launcher" ] || [ -f "build/launcher.exe" ]; then
            if [[ "${{ matrix.platform }}" == "windows" ]]; then
              if [ -f "build/launcher.exe" ]; then
                cp build/launcher.exe archive/launcher.exe
                zip -u "$ZIP_NAME" archive/launcher.exe
              fi
            else
              if [ -f "build/launcher" ]; then
                cp build/launcher archive/launcher
                chmod +x archive/launcher
                zip -u "$ZIP_NAME" archive/launcher
              fi
            fi
            echo "✅ Added launcher to zip"
          fi
          
          # List created files
          echo "=== Created files ==="
          ls -la *.zip 2>/dev/null || echo "No zip files"
          ls -la setup-* 2>/dev/null || echo "No setup files"
          
          # Move files for upload
          mkdir -p release-artifacts
          mv *.zip release-artifacts/ 2>/dev/null || true
          mv setup-* release-artifacts/ 2>/dev/null || true

      # Upload artifacts for release
      - name: Upload artifacts to Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release-artifacts/*.zip
            release-artifacts/setup-*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Upload as workflow artifacts (for PR or manual runs)
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/')"
        with:
          name: release-artifacts-${{ matrix.artifact_suffix }}
          path: release-artifacts/
          retention-days: 30

  # Create release summary
  create-release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') && github.event_name != 'pull_request'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-artifacts-*
          path: all-artifacts
          merge-multiple: true
          
      - name: List all artifacts
        run: |
          echo "=== All artifacts ==="
          ls -la all-artifacts/
          
      - name: Upload to release (all artifacts)
        uses: softprops/action-gh-release@v1
        with:
          files: all-artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
