name: Build Multi-Platform

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux
            arch: x64
            artifact_suffix: linux-x64
          
          # Linux ARM64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            platform: linux
            arch: arm64
            artifact_suffix: linux-arm64
            setup_cross: true
          
          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows
            arch: x64
            artifact_suffix: windows-x64
          
          # Windows ARM64
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            platform: windows
            arch: arm64
            artifact_suffix: windows-arm64
          
          # macOS x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: macos
            arch: x64
            artifact_suffix: macos-x64
          
          # macOS ARM64
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos
            arch: arm64
            artifact_suffix: macos-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup Rust
      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          override: true

      # Install cross-compilation dependencies for Linux ARM64
      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.setup_cross == true
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Setup Python (для запуска build.py)
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Install Python dependencies if needed
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # Раскомментируйте если нужны дополнительные пакеты
          # pip install -r requirements.txt

      # Run build.py
      - name: Run build.py
        run: python build.py
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ env.CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER }}

      # Upload build artifacts
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.artifact_suffix }}
          path: build/
          retention-days: 30
          if-no-files-found: error

  # Upload all artifacts combined
  upload-all-artifacts:
    needs: build
    runs-on: ubuntu-latest
    if: always() && github.event_name != 'pull_request'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          pattern: build-*
          merge-multiple: true
          
      - name: Create combined archive
        run: |
          if [ -d "all-artifacts" ] && [ "$(ls -A all-artifacts)" ]; then
            cd all-artifacts
            zip -r ../all-builds-$(date +%Y%m%d-%H%M%S).zip .
            cd ..
            echo "Combined archive created with $(ls all-artifacts | wc -l) files"
          else
            echo "No artifacts to combine"
          fi
          
      - name: Upload combined archive
        uses: actions/upload-artifact@v4
        with:
          name: all-builds-combined
          path: all-builds-*.zip
          retention-days: 30
          if-no-files-found: warn
