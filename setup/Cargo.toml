[package]
name = "uran_installer"
version = "1.0.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.11", features = ["blocking"] }
zip = "0.6"
winapi = { version = "0.3", features = ["winbase", "shellapi", "winuser", "libloaderapi", "handleapi", "processthreadsapi", "securitybaseapi", "winnt"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1